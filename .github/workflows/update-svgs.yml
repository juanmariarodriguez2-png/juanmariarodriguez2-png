# Regenerates the terminal-style SVGs in /assets with live GitHub data and
# commits them only when something actually changed.
name: Update profile SVGs

on:
  schedule:
    - cron: '17 4 * * *' # daily, 04:17 UTC (off the hour to avoid queue spikes)
  workflow_dispatch: # manual "Run workflow" button
  push:
    branches: [main]
    paths: # re-render right away when the content or the renderer changes
      - 'scripts/**'
      - '.github/workflows/update-svgs.yml'

permissions:
  contents: write # needed to push the refreshed SVGs

concurrency:
  group: update-svgs
  cancel-in-progress: false

jobs:
  render:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: 22

      - name: Generate SVGs
        run: node scripts/generate.mjs
        env:
          # GH_PAT (optional secret) adds private contributions and repos;
          # without it the built-in token only sees public activity.
          GITHUB_TOKEN: ${{ secrets.GH_PAT || secrets.GITHUB_TOKEN }}
          INCLUDE_PRIVATE: ${{ secrets.GH_PAT != '' }}
          GH_USER: ${{ github.repository_owner }}

      - name: Commit changes
        run: |
          git add assets
          if git diff --cached --quiet; then
            echo "SVGs unchanged, nothing to commit."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "chore: refresh profile SVGs"
          git push
